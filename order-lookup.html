<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H&H 品牌嚴選 - 訂單進度查詢</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brand-dark: #0f172a;
      --brand-primary: #1e3a8a;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --radius-lg: 20px;
      --radius-md: 12px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-main);
      margin: 0;
      padding: 0 0 50px 0;
      line-height: 1.5;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .brand-hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%);
      color: #ffffff;
      padding: 32px 20px 24px 20px;
      text-align: center;
      border-radius: 0 0 24px 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
    }

    .brand-company-title {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 4px;
      margin: 0 0 4px 0;
      color: #ffffff;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .search-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .search-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 14px;
      color: var(--brand-dark);
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      padding: 14px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 1rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--brand-primary);
    }

    .search-btn {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: var(--radius-md);
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
    }

    .order-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .order-id {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--brand-dark);
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .badge-paid { background: #dcfce7; color: #15803d; }
    .badge-pending { background: #fef9c3; color: #a16207; }
    .badge-cancel { background: #fee2e2; color: #b91c1c; }

    .order-detail {
      font-size: 0.92rem;
      color: var(--text-sub);
      line-height: 1.6;
    }

    .order-items {
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      margin: 8px 0;
      font-weight: 600;
      color: var(--text-main);
      white-space: pre-line;
    }

    .back-home {
      text-align: center;
      margin-top: 24px;
    }

    .back-home a {
      color: var(--brand-primary);
      text-decoration: none;
      font-weight: 700;
    }

    .contact-info-box {
      text-align: center;
      margin-top: 18px;
      padding: 12px;
      background: #eff6ff;
      border-radius: 12px;
      color: var(--brand-primary);
      font-weight: 700;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="brand-hero">
  <div class="brand-company-title">南良國際</div>
  <div class="brand-subtitle">訂單進度與狀態查詢</div>
</div>

<div class="container">
  <div class="search-card">
    <div class="search-title">🔍 查詢您的訂單</div>
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="請輸入訂購手機號碼或訂單編號">
      <button class="search-btn" onclick="performLookup()">查詢</button>
    </div>
  </div>

  <div id="resultsList"></div>

  <div class="contact-info-box">
    📞 客服免付費專線：<a href="tel:0800660677" style="color:var(--brand-primary); text-decoration:underline;">0800-660-677</a>
  </div>

  <div class="back-home">
    <a href="index.html">← 返回團購旗艦館頁面</a>
  </div>
</div>

<script>
  // ⚠️ 請填寫您的 Google Apps Script Web App API 部署網址 (需以 /exec 結尾)
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxLmaRbdC9jM9t3CerENr61l8yVHchvme6hXTdJZ7kMFOpr1JuOjMarmjJkoo4g4a_klQ/exec"; 

  function performLookup() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) {
      alert("請輸入手機號碼或訂單編號！");
      return;
    }

    const container = document.getElementById('resultsList');
    container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-sub);">正在查詢訂單資料中...</div>`;

    fetch(`${GAS_API_URL}?action=lookup&query=${encodeURIComponent(query)}`)
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          renderOrders(data.orders);
        } else {
          container.innerHTML = `<div style="text-align:center; color:#ef4444; padding:20px;">${data.message}</div>`;
        }
      })
      .catch(err => {
        container.innerHTML = `<div style="text-align:center; color:#ef4444; padding:20px;">連線失敗，請確認 API 設定或稍後再試。</div>`;
      });
  }

  function renderOrders(orders) {
    const container = document.getElementById('resultsList');
    container.innerHTML = "";

    if (orders.length === 0) {
      container.innerHTML = `<div style="text-align:center; background: #fff; padding: 30px; border-radius:16px; border:1px solid #e2e8f0; color:var(--text-sub);">查無相符的訂單紀錄，請確認輸入資料是否正確。</div>`;
      return;
    }

    orders.forEach(order => {
      let statusClass = "badge-pending";
      if (order.shippingStatus === "已出貨" || order.paymentStatus === "已付款") statusClass = "badge-paid";
      if (order.shippingStatus === "已取消") statusClass = "badge-cancel";

      const html = `
        <div class="order-card">
          <div class="order-header">
            <span class="order-id">單號：${order.orderId}</span>
            <span class="status-badge ${statusClass}">${order.shippingStatus || "處理中"} (${order.paymentStatus})</span>
          </div>
          <div class="order-detail">
            <div><strong>下單時間：</strong>${order.orderTime}</div>
            <div><strong>訂購姓名：</strong>${order.custName}</div>
            <div><strong>付款方式：</strong>${order.paymentMethod}</div>
            <div class="order-items"><strong>購買明細：</strong>\n${order.items}</div>
            <div><strong>訂單總金額：</strong><span style="color:#ef4444; font-weight:800; font-size:1.1rem;">$ ${order.totalAmount}</span></div>
          </div>
        </div>
      `;
      container.innerHTML += html;
    });
  }
</script>

</body>
</html>
